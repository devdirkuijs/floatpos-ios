name: Build FloatPOS iOS
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate app icon & splash
        run: npx @capacitor/assets generate --ios --splashBackgroundColor "#0A0D13" --splashBackgroundColorDark "#0A0D13"

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # Capacitor 8 ships SPM (Package.swift), so there is App.xcodeproj only —
      # no CocoaPods App.xcworkspace unless pods are added later.
      - name: Show iOS project layout
        run: |
          set -euo pipefail
          echo "---- ios/App ----"
          ls -la ios/App
          echo "---- xcodebuild -list ----"
          xcodebuild -project ios/App/App.xcodeproj -list

      - name: Build release (iOS Simulator, unsigned)
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name "*.app" -type d | head -1)
          echo "Built app: $APP"
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/artifact"
          cp -R "$APP" "$RUNNER_TEMP/artifact/"
          ls -la "$RUNNER_TEMP/artifact"

      - name: Upload FloatPOS.app
        uses: actions/upload-artifact@v4
        with:
          name: FloatPOS-ios-simulator-app
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
