name: Build FloatPOS iOS
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate app icon & splash
        run: npx @capacitor/assets generate --ios --splashBackgroundColor "#0A0D13" --splashBackgroundColorDark "#0A0D13"

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build unsigned archive (generic iOS device)
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FloatPOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          echo "---- archive ----"
          ls -la "$RUNNER_TEMP/FloatPOS.xcarchive"

      - name: Upload xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: FloatPOS-ios-xcarchive
          path: ${{ runner.temp }}/FloatPOS.xcarchive
          if-no-files-found: error
